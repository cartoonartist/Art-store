<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commission Artwork | Kanishk Art Store</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        emailjs.init("2XhNwiYxl5KZMK4d0");
    </script>
</head>
<body>
    <nav>
        <div class="logo">KANISHK ART STORE</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="drawings.html">Drawings</a></li>
            <li><a href="keychains.html">Keychains</a></li>
            <li><a href="commissions.html">Commission</a></li>
        </ul>
    </nav>

    <section class="section">
        <h2 class="section-title">COMMISSION ARTWORK</h2>
        
        <form id="commissionForm">
            <input type="text" id="commissionName" placeholder="Full Name" required>
            <textarea id="commissionAddress" placeholder="Complete Address (with house number, street, landmark)" required></textarea>
            <input type="text" id="commissionCity" placeholder="City" required>
            <input type="number" id="commissionPincode" placeholder="Pincode" required>
            <input type="tel" id="commissionPhone" placeholder="Phone Number (with country code)" required>
            
            <label style="text-align:left; margin-top:10px;">Select Size:</label>
            <select id="sheetSize">
                <option value="0">A5</option>
                <option value="50">A4 (+₹50)</option>
                <option value="100">A3 (+₹100)</option>
                <option value="200">A2 (+₹200)</option>
            </select>
            
            <label style="text-align:left; margin-top:10px;">Select Medium:</label>
            <select id="medium">
                <option value="350">Sketch (₹350)</option>
                <option value="500">Coloured (₹500)</option>
            </select>
            
            <h3 id="commissionPrice">Total : ₹350</h3>
            
            <button type="button" onclick="commissionOrder()">Order Commission</button>
        </form>
    </section>

    <!-- PAYMENT POPUP -->
    <div id="paymentPopup" class="popup">
        <div class="popup-content">
            <span id="closePopup">&times;</span>
            <h2>Complete Payment</h2>
            <img src="images/QR.jpg" alt="QR Code" class="qr">
            <p>Scan QR code & pay the exact amount</p>
            <input type="file" id="paymentScreenshot" accept="image/*" required>
            <button id="submitPayment">Submit Payment Proof</button>
        </div>
    </div>

    <footer>
        <h3>Kanishk Art Store</h3>
        <p>Handmade Art • Custom Artwork • Keychains</p>
        <p>Instagram : @kanishkv_456</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
